<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Deadline Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="bg-root"></div>

<nav class="navbar">
  <a href="index.html" class="brand"><span class="dot">◉</span> Deadline Radar</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="index.html#features">Features</a>
    <a href="index.html#how-it-works">How It Works</a>
    <a href="login.html">Login</a>
  </div>
  <div class="nav-actions">
    <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card" style="max-width:480px;">
    <div class="brand"><span class="dot">◉</span> Deadline Radar</div>
    <h1>Create your account</h1>
    <p class="sub">Sign up with Google — no password to remember. You can add your department and semester afterwards from Settings.</p>

    <button type="button" class="btn btn-primary btn-block" id="googleSignInBtn" style="display:flex;align-items:center;justify-content:center;gap:10px;">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.9 5.1 29.7 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.9 5.1 29.7 3 24 3c-7.7 0-14.4 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.6 0 10.7-1.9 14.6-5.2l-6.7-5.7C29.8 35.7 27 36.5 24 36.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.6 40.6 16.3 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 3-3.1 5.5-5.9 7.1l6.7 5.7C39.5 38.4 43 32 43 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="auth-foot" style="justify-content:center;">
      <span style="color:var(--text-mid);">Already have an account?&nbsp;</span><a href="login.html">Login</a>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
  <script src="js/firebase-auth.js"></script>
<script src="js/animations.js"></script>
<script>
DR.settings.apply();

document.getElementById('googleSignInBtn').addEventListener('click', function(){
  DR.auth.signInWithGoogle().then(function(){
    DR.toast('safe','Account created','Welcome to Deadline Radar! Redirecting to your dashboard…', 1800);
    setTimeout(() => window.location.href = 'dashboard.html', 700);
  }).catch(function(err){
    console.error(err);
    DR.toast('critical','Sign-up failed', err.message || 'Something went wrong. Please try again.');
  });
});
</script>
</body>
</html>
